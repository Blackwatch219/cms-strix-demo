name: Security Scan

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ── Strix Quick Scan (PR only) ──
  strix-quick:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Strix
        run: curl -sSL https://strix.ai/install | bash

      - name: Run Quick Security Scan
        env:
          STRIX_LLM: ${{ secrets.STRIX_LLM }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_API_BASE: ${{ secrets.LLM_API_BASE }}
        run: strix -n -t ./ --scan-mode quick

      - name: Upload Quick Scan Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strix-quick-results
          path: strix_runs/

  # ── Strix Deep Scan (schedule only) ──
  strix-deep:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Strix
        run: curl -sSL https://strix.ai/install | bash

      - name: Run Deep Security Scan
        env:
          STRIX_LLM: ${{ secrets.STRIX_LLM }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_API_BASE: ${{ secrets.LLM_API_BASE }}
        run: strix -n -t ./ --scan-mode deep

      - name: Upload Deep Scan Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strix-deep-results-${{ github.run_id }}
          path: strix_runs/
          retention-days: 90

  # ── Trivy dependency scan → GitHub Security tab ──
  trivy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH

      - name: Upload to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-results.sarif
