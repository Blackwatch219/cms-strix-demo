name: Security Scan

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ═══════════════════════════════════════════════════════════
  # CodeQL — static analysis → GitHub Security tab
  # ═══════════════════════════════════════════════════════════
  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@main
        with:
          egress-policy: audit

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript
          queries: security-and-quality

      - name: CodeQL Analysis
        uses: github/codeql-action/analyze@v4

  # ═══════════════════════════════════════════════════════════
  # Semgrep — SAST + secrets + supply-chain → GitHub Security tab
  # ═══════════════════════════════════════════════════════════
  semgrep:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@main
        with:
          egress-policy: audit

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@main
        with:
          python-version: '3.x'

      - name: Install Semgrep
        run: pip install semgrep

      - name: Run Semgrep
        continue-on-error: true
        run: |
          semgrep scan \
            --config auto \
            --config "p/javascript" \
            --config "p/owasp-top-ten" \
            --config "p/secrets" \
            --config "p/supply-chain" \
            --config "p/github-actions" \
            --sarif --output semgrep.sarif

      - name: Upload to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: semgrep.sarif

  # ═══════════════════════════════════════════════════════════
  # Trivy — dependency vulnerabilities → GitHub Security tab
  # ═══════════════════════════════════════════════════════════
  trivy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@main
        with:
          egress-policy: audit

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH

      - name: Upload to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-results.sarif

  # ═══════════════════════════════════════════════════════════
  # Zizmor — GitHub Actions workflow security
  # ═══════════════════════════════════════════════════════════
  zizmor:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@main
        with:
          egress-policy: audit

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run Zizmor
        uses: zizmorcore/zizmor-action@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # ═══════════════════════════════════════════════════════════
  # Strix Quick — AI penetration test (PR + push)
  # ═══════════════════════════════════════════════════════════
  strix-quick:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@main
        with:
          egress-policy: audit

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Strix
        run: curl -sSL https://strix.ai/install | bash

      - name: Run Quick Security Scan
        env:
          STRIX_LLM: ${{ secrets.STRIX_LLM }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_API_BASE: ${{ secrets.LLM_API_BASE }}
        run: strix -n -t ./ --scan-mode quick

      - name: Upload Quick Scan Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strix-quick-results
          path: strix_runs/

  # ═══════════════════════════════════════════════════════════
  # Strix Deep — AI penetration test (schedule only)
  # ═══════════════════════════════════════════════════════════
  strix-deep:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@main
        with:
          egress-policy: audit

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Strix
        run: curl -sSL https://strix.ai/install | bash

      - name: Run Deep Security Scan
        env:
          STRIX_LLM: ${{ secrets.STRIX_LLM }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_API_BASE: ${{ secrets.LLM_API_BASE }}
        run: strix -n -t ./ --scan-mode deep

      - name: Upload Deep Scan Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strix-deep-results-${{ github.run_id }}
          path: strix_runs/
          retention-days: 90
